<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee https://api.open-meteo.com https://api.openstreetmap.org https://tile.openstreetmap.org; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suntime – sol på uteserveringar i Göteborg</title>
  <meta name="description" content="Se vilka uteserveringar i Göteborg som har sol just nu.">
  <meta name="theme-color" content="#f5a623">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Suntime">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="top">
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Öppna menyn" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="brand"><span class="logo">☀︎</span> Suntime <select id="city" class="city" aria-label="Stad"></select></div>
    <div id="weather" class="weather">–</div>
  </header>

  <div id="map"></div>
    <div class="timebar timebar-bottom">
      <select id="day" aria-label="Dag">
        <option value="0">Idag</option>
        <option value="1">Imorgon</option>
      </select>
      <input type="range" id="time" min="0" max="1435" step="5" aria-label="Tid">
      <span id="timeLabel" class="timelabel">--:--</span>
      <button id="nowBtn" class="chip" type="button">Nu</button>
    </div>
  <div id="backdrop" class="backdrop" hidden></div>

  <section class="panel" id="panel">
    <div class="drawer-head"><b>Serveringar</b><button id="menuClose" class="close-x" type="button" aria-label="Stäng menyn">✕</button></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Sök servering…" autocomplete="off">
      <select id="sort" aria-label="Sortering">
        <option value="sun">Mest sol kvar</option>
        <option value="near">Närmast mig</option>
        <option value="name">Namn</option>
      </select>
      <label class="chip toggle"><input type="checkbox" id="onlyFav"> ★</label>
    </div>
    <div class="controls">
      <select id="kind" aria-label="Typ">
        <option value="">Alla typer</option>
        <option value="restaurant">Restauranger</option>
        <option value="bar">Barer &amp; pubar</option>
        <option value="cafe">Caféer</option>
      </select>
      <label class="chip toggle"><input type="checkbox" id="onlyOpen"> Öppet nu</label>
    </div>
    <div id="status" class="status">Startar…</div>
    <button id="best" class="best" type="button" hidden></button>
    <ul id="list" class="list"></ul>
    <footer class="foot">
      Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-bidragsgivare ·
      Väder: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> ·
      Skuggor är uppskattade från byggnadshöjder.<br>
      <button id="addMissing" class="link" type="button">Saknas en uteservering?</button> ·
      <button id="showHidden" class="link" type="button">Visa dolda</button> ·
      <button id="refresh" class="link" type="button">Hämta om data</button>
    </footer>
  </section>

  <div id="sheet" class="sheet" hidden></div>
  <div id="install" class="install" hidden>
    <span>Lägg till Suntime på hemskärmen</span>
    <button id="installBtn" class="btn" type="button">Installera</button>
    <button id="installClose" class="link" type="button" aria-label="Stäng">✕</button>
  </div>

  <script src="lib/leaflet.js"></script>
  <script src="lib/suncalc.js"></script>
  <script src="shadow.js?v=9"></script>
  <script src="hours.js?v=9"></script>
  <script src="sunview.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
